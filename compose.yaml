# TrueNAS custom app "shutdown-relay" (deployed through the apps API); talks to TrueNAS over JSON-RPC/WebSocket. Secrets are filled in at deploy time:
#   RELAY_TOKEN (what n8n sends), TRUENAS_API_KEY (user shutdown-agent, Full Admin, 90-day expiry; renew before 2027-01-03).
name: shutdown-relay
services:
  relay:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      TRUENAS_URL: https://nas.synapia.cc
      RELAY_TOKEN: "<token>"
      TRUENAS_API_KEY: "<key>"
    configs:
      - source: relay
        target: /relay.js
    command: ["node", "/relay.js"]
    networks: [traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.shutdown-relay.rule=Host(`shutdown.synapia.cc`)"
      - "traefik.http.routers.shutdown-relay.entrypoints=websecure"
      - "traefik.http.routers.shutdown-relay.tls=true"
      - "traefik.http.routers.shutdown-relay.tls.certresolver=letsencrypt"
      - "traefik.http.services.shutdown-relay.loadbalancer.server.port=8080"
configs:
  relay:
    file: ./relay.js
networks:
  traefik-public:
    external: true
